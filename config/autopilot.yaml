runs_per_day: 200
dollars_per_day: 20.00
tripwires: enabled

# High-confidence auto-publish lane. docs-only verdicts at/above this confidence
# are published straight to the public catalog (signed, via the normal approve
# path); everything below stays in catalog/pending/ for the operator gate. This
# keeps the public catalog growing unattended instead of silently freezing when
# nobody drains the queue. Set to 0 to disable (pure human gate).
auto_publish:
  docs_only_min_confidence: 0.70

# S2.1 deterministic N-agent chain composition.
chain_composition:
  # Kill switch: set false to stop composing authored chains into pending/chains/.
  enabled: true
  # Composed chains below this confidence are flagged for the bounded LLM judge.
  publish_confidence_threshold: 0.6
  # Hard cap on judge calls per composition run.
  judge_batch_max: 10

# S2.3 dependency-light triage that re-orders the pair planner (never publishes).
triage:
  # Kill switch: set false to fall back to plain composite-product ordering.
  enabled: true
