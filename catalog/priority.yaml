# Autopilot priority queue. Each entry asks the tick orchestrator to enqueue
# a sandbox run for the given (scenario, agents) pair on its next tick. Once
# enqueued, the entry stays in state/coverage.json so the tick is idempotent
# until the entry is removed or the file is wiped.
#
# Schema:
#   priority:
#     - { scenario: <scenario_name>, agents: [<slug>, <slug>, ...] }
#
# Entries are processed in order, subject to the daily budget cap.

priority: []
