line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "RUF"]
ignore = ["S101", "S603", "S607"]

[lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "B008"]

[lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.File",
  "fastapi.Form",
]
