line-length = 100
target-version = "py311"

[lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "RUF"]
ignore = ["S101", "S603", "S607"]

[lint.per-file-ignores]
# Tests carry long inline JSON-fixture lines, dict() literals for keyword
# convenience, and zip() calls where the strict= flag is noise — none of
# which signal production-code issues.
"tests/*" = ["S101", "S105", "S106", "B008", "E501", "B905", "C408"]
# Chain-composition tests use the rubric's risk-band identifiers (A/B/C/D/E)
# as function/argument names verbatim, so the uppercase-naming rules don't apply.
"tests/unit/test_chains_composition.py" = [
  "S101", "S105", "S106", "B008", "E501", "B905", "C408", "N802", "N803",
]
# Bulk-seed data tables: the v2_e ontology defines hand-authored agent
# seeds and category presets as long inline literals. Wrapping rows would
# obscure the alignment between fields. The data is committed once and
# rarely edited.
"scripts/v2_e/*.py" = ["E501", "E702"]

[lint.flake8-bugbear]
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Header",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Cookie",
  "fastapi.File",
  "fastapi.Form",
]
