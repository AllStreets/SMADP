# gitleaks configuration for SMADP.
#
# Extends the default ruleset and allowlists known test fixtures. The
# redaction tests must contain a secret-shaped string in order to prove the
# redaction logic strips it; those are dummy placeholders, not real keys.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures and example/dummy secrets"
paths = [
  '''tests/sandbox/test_redaction\.py''',
]
regexes = [
  # Obvious placeholder used across redaction tests.
  '''sk-proj-abc123-secret''',
]
