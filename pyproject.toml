[project]
name = "smadp"
version = "0.1.0"
description = "Safe Multi-Agent Deployment Platform — auditable, evidence-cited verdicts on whether AI agents can safely run together."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Connor Evans", email = "connorevans29@gmail.com" }]
keywords = ["ai", "agents", "safety", "security", "compliance", "multi-agent", "sandbox", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Information Technology",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
  "anthropic>=0.40.0",
  "pydantic>=2.7",
  "click>=8.1",
  "rich>=13.7",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "jsonschema>=4.22",
  "pyyaml>=6.0",
  "platformdirs>=4.2",
  "python-multipart>=0.0.9",
  "websockets>=12.0",
  "structlog>=24.1",
  "tenacity>=8.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "respx>=0.21",
]
sandbox = [
  "podman>=4.10.0; platform_system=='Linux'",
]

[project.scripts]
smadp = "smadp.cli:main"

[project.urls]
Homepage = "https://github.com/AllStreets/SMADP"
Repository = "https://github.com/AllStreets/SMADP"
Issues = "https://github.com/AllStreets/SMADP/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smadp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "A", "C4", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
filterwarnings = ["error", "ignore::DeprecationWarning"]
markers = [
  "integration: requires external services",
  "sandbox: requires container runtime",
  "slow: takes more than a second",
  "network: requires network access",
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

# v1 stubs: CLI/API orchestration paths that call the async profiler/analyzer/
# sandbox queue with placeholder signatures. They are intentional v1.0
# placeholders — the catalog/lint/dashboard ship paths are fully typed.
# Tracked for v1.1 wiring; see https://github.com/AllStreets/SMADP/issues
[[tool.mypy.overrides]]
module = [
  "smadp.cli",
  "smadp.api.routes.submit",
  "smadp.api.routes.evaluate",
  "smadp.api.routes.sandbox",
  "smadp.api.routes.verdicts",
  "smadp.api.routes.frameworks",
]
disable_error_code = [
  "unused-ignore",
  "call-arg",
  "arg-type",
  "assignment",
  "attr-defined",
  "no-any-return",
]
