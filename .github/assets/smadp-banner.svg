<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-label="SMADP — Safe Multi-Agent Deployment Platform">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0712"/>
      <stop offset="0.5" stop-color="#15082a"/>
      <stop offset="1" stop-color="#070810"/>
    </linearGradient>

    <radialGradient id="glowA" cx="0.32" cy="0.45" r="0.35">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowB" cx="0.78" cy="0.55" r="0.35">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.40"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="0.45" stop-color="#7C3AED"/>
      <stop offset="0.85" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>

    <linearGradient id="taglineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E5DEFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#A5F3FC" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="shieldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Grid pattern -->
    <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1a1330" stroke-width="0.5" opacity="0.6"/>
    </pattern>

    <!-- Glow filter for the wordmark -->
    <filter id="textGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur"/>
      <feFlood flood-color="#7C3AED" flood-opacity="0.55" result="purple"/>
      <feComposite in="purple" in2="blur" operator="in" result="glowPurple"/>
      <feMerge>
        <feMergeNode in="glowPurple"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>

    <!-- Node style -->
    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C7B8FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </radialGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glowA)"/>
  <rect width="1280" height="360" fill="url(#glowB)"/>

  <!-- Faint network motif behind the wordmark -->
  <g opacity="0.25" stroke="#7C3AED" stroke-width="1" fill="none">
    <!-- Edges -->
    <path d="M 180 110 L 320 200 L 480 90 L 640 240 L 800 110 L 960 230 L 1100 130"/>
    <path d="M 180 250 L 320 200 L 480 290 L 640 200 L 800 280 L 960 200 L 1100 250"/>
    <path d="M 320 200 L 640 200 L 960 200"/>
  </g>
  <g opacity="0.85">
    <circle cx="180"  cy="110" r="4" fill="url(#node)"/>
    <circle cx="320"  cy="200" r="5" fill="url(#node)"/>
    <circle cx="480"  cy="90"  r="4" fill="url(#node)"/>
    <circle cx="640"  cy="240" r="4" fill="url(#node)"/>
    <circle cx="800"  cy="110" r="5" fill="url(#node)"/>
    <circle cx="960"  cy="230" r="4" fill="url(#node)"/>
    <circle cx="1100" cy="130" r="5" fill="url(#node)"/>
    <circle cx="180"  cy="250" r="4" fill="url(#node)"/>
    <circle cx="480"  cy="290" r="4" fill="url(#node)"/>
    <circle cx="800"  cy="280" r="4" fill="url(#node)"/>
    <circle cx="1100" cy="250" r="4" fill="url(#node)"/>
  </g>

  <!-- Shield icon (left of wordmark) -->
  <g transform="translate(140, 90)">
    <path
      d="M 60 0 L 110 18 V 62 C 110 92 88 116 60 124 C 32 116 10 92 10 62 V 18 Z"
      fill="url(#shieldFace)" stroke="#A78BFA" stroke-width="1" filter="url(#softGlow)"/>
    <path
      d="M 60 0 L 110 18 V 62 C 110 92 88 116 60 124 C 32 116 10 92 10 62 V 18 Z"
      fill="url(#shieldFace)" stroke="#A78BFA" stroke-width="1"/>
    <!-- Checkmark / 5-risk indicator -->
    <path d="M 35 62 L 52 79 L 85 42" fill="none" stroke="#0b0712" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Wordmark -->
  <g filter="url(#textGlow)">
    <text
      x="640"
      y="200"
      text-anchor="middle"
      fill="url(#wordmark)"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'JetBrains Mono', monospace"
      font-size="148"
      font-weight="900"
      letter-spacing="18"
    >SMADP</text>
  </g>

  <!-- Subtitle / tagline -->
  <text
    x="640"
    y="262"
    text-anchor="middle"
    fill="#E5DEFF"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="22"
    font-weight="600"
    letter-spacing="6"
    opacity="0.95"
  >SAFE   MULTI-AGENT   DEPLOYMENT   PLATFORM</text>

  <text
    x="640"
    y="304"
    text-anchor="middle"
    fill="url(#taglineGrad)"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="20"
    font-style="italic"
    opacity="0.92"
  >Auditable, evidence-cited verdicts on whether autonomous agents can safely run together.</text>

  <!-- Bottom accent rule with gradient -->
  <rect x="380" y="332" width="520" height="2" fill="url(#wordmark)" opacity="0.5"/>
</svg>
