<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="SMADP — Safe Multi-Agent Deployment Platform">
  <defs>
    <!-- Subtle dot grid -->
    <pattern id="grid" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.9" fill="#1a0b2e"/>
    </pattern>

    <!-- Background depth gradient -->
    <radialGradient id="bgVignette" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0" stop-color="#0f0820" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.5"/>
    </radialGradient>

    <!-- Background ambient glows -->
    <radialGradient id="glowPurple" cx="0.2" cy="0.4" r="0.4">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.78" cy="0.6" r="0.42">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <!-- Wordmark gradient (vertical depth) -->
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#E5DEFF"/>
      <stop offset="35%"  stop-color="#A78BFA"/>
      <stop offset="65%"  stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <!-- Glossy top highlight on the title -->
    <linearGradient id="wordmarkLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft purple glow halo behind the title -->
    <filter id="glow" x="-10%" y="-30%" width="120%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Accent stripe gradient (top + bottom borders) -->
    <linearGradient id="stripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#7C3AED" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#A78BFA" stop-opacity="1"/>
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0"/>
    </linearGradient>

    <!-- Side panel face -->
    <linearGradient id="panel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#150827" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#06030f" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Tier-colored stat values -->
    <linearGradient id="tierGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>

    <!-- Shield face -->
    <linearGradient id="shieldFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>

    <!-- Network node -->
    <radialGradient id="node" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C7B8FF"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="#0b0712"/>
  <rect width="1200" height="340" fill="url(#grid)"/>
  <rect width="1200" height="340" fill="url(#glowPurple)"/>
  <rect width="1200" height="340" fill="url(#glowCyan)"/>
  <rect width="1200" height="340" fill="url(#bgVignette)"/>

  <!-- Accent stripes (top + bottom edges) -->
  <rect x="0" y="0"     width="1200" height="1.5" fill="url(#stripe)"/>
  <rect x="0" y="338.5" width="1200" height="1.5" fill="url(#stripe)"/>

  <!-- Faint network motif behind the title — graph nodes wired together -->
  <g opacity="0.18" stroke="#7C3AED" stroke-width="1" fill="none">
    <path d="M 110 100 L 220 180 L 360 80 L 510 220 L 640 110 L 770 230"/>
    <path d="M 110 240 L 220 180 L 360 270 L 510 180 L 640 260 L 770 170"/>
    <path d="M 220 180 L 510 180 L 770 200"/>
  </g>
  <g opacity="0.7">
    <circle cx="110" cy="100" r="3.5" fill="url(#node)"/>
    <circle cx="220" cy="180" r="4"   fill="url(#node)"/>
    <circle cx="360" cy="80"  r="3.5" fill="url(#node)"/>
    <circle cx="510" cy="220" r="3.5" fill="url(#node)"/>
    <circle cx="640" cy="110" r="4"   fill="url(#node)"/>
    <circle cx="770" cy="230" r="3.5" fill="url(#node)"/>
    <circle cx="110" cy="240" r="3.5" fill="url(#node)"/>
    <circle cx="360" cy="270" r="3.5" fill="url(#node)"/>
    <circle cx="770" cy="170" r="3.5" fill="url(#node)"/>
  </g>

  <!-- Eyebrow — small mono tag above the title -->
  <g transform="translate(80, 78)">
    <rect x="0" y="-13" width="16" height="2" fill="#A78BFA"/>
    <text x="26" y="0"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="13"
      fill="#A78BFA"
      letter-spacing="0.35em">SMADP</text>
  </g>

  <!-- Shield mark, small, to the right of the eyebrow -->
  <g transform="translate(220, 56)" opacity="0.85">
    <path
      d="M 16 0 L 32 6 V 20 C 32 30 24 36 16 38 C 8 36 0 30 0 20 V 6 Z"
      fill="url(#shieldFace)" stroke="#C7B8FF" stroke-width="0.8"/>
    <path d="M 8 20 L 14 26 L 24 14"
      fill="none" stroke="#0b0712" stroke-width="2.5"
      stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Big 3D wordmark · 4-layer stack -->
  <g transform="translate(80, 215)">
    <!-- 1. Depth shadow -->
    <text
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-weight="900" font-size="118" fill="#0d0820"
      letter-spacing="-0.04em" transform="translate(6, 6)">SMADP.</text>
    <!-- 2. Soft glow halo -->
    <text
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-weight="900" font-size="118" fill="#7C3AED" fill-opacity="0.38"
      letter-spacing="-0.04em" filter="url(#glow)">SMADP.</text>
    <!-- 3. Painted face -->
    <text
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-weight="900" font-size="118" fill="url(#wordmark)"
      letter-spacing="-0.04em">SMADP.</text>
    <!-- 4. Glossy top highlight -->
    <text
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-weight="900" font-size="118" fill="url(#wordmarkLight)"
      letter-spacing="-0.04em">SMADP.</text>
  </g>

  <!-- Tagline · two compact lines that stay left of the stats panel (x=840) -->
  <text x="80" y="258"
    font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    font-size="19" fill="#cbb9f5">
    Auditable, evidence-cited verdicts on whether
  </text>
  <text x="80" y="284"
    font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
    font-size="19" fill="#cbb9f5">
    autonomous agents can safely run together.
  </text>
  <text x="80" y="312"
    font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
    font-size="12" fill="#8b7eb6" letter-spacing="0.04em">
    Five risks · LLM-judged · Docker-sandbox validated · Operator-gated publish
  </text>

  <!-- Right-side stats panel -->
  <g transform="translate(840, 60)">
    <rect x="0" y="0" width="280" height="220" rx="12"
      fill="url(#panel)" stroke="#2a1a48" stroke-width="1"/>

    <!-- Header rule -->
    <line x1="20" y1="32" x2="48" y2="32" stroke="#A78BFA" stroke-width="2"/>
    <text x="56" y="36"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11" fill="#A78BFA" letter-spacing="0.18em">CATALOG SNAPSHOT</text>

    <!-- profiles -->
    <text x="20" y="74"
      font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="32"
      fill="#e6dffa">6,000+</text>
    <text x="20" y="92"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11" fill="#8b7eb6" letter-spacing="0.14em">AGENT PROFILES</text>

    <!-- verdicts -->
    <text x="20" y="132"
      font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="32"
      fill="#A78BFA">1900+</text>
    <text x="20" y="150"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11" fill="#8b7eb6" letter-spacing="0.14em">PAIRWISE VERDICTS</text>

    <!-- sandbox-validated (exact — the meaningful number stays precise) -->
    <text x="20" y="190"
      font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="32"
      fill="url(#tierGreen)">7</text>
    <text x="20" y="208"
      font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace"
      font-size="11" fill="#8b7eb6" letter-spacing="0.14em">SANDBOX-VALIDATED</text>
  </g>
</svg>
