<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="SMADP chain topologies — linear, star, loop">
  <defs>
    <!-- Subtle dot grid -->
    <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.8" fill="#1a0b2e"/>
    </pattern>

    <!-- Ambient glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0.55" stop-color="#0b0712" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Agent node face -->
    <linearGradient id="agentFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1647"/>
      <stop offset="1" stop-color="#150828"/>
    </linearGradient>

    <!-- Card shadow -->
    <filter id="agentShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft halo around agents -->
    <filter id="agentGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feFlood flood-color="#7C3AED" flood-opacity="0.5"/>
      <feComposite in2="b" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Arrow markers -->
    <marker id="agentArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA"/>
    </marker>
    <marker id="reviseArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>

    <!-- Frame stroke -->
    <linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" fill="#0b0712"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <rect width="1280" height="360" fill="url(#vignette)"/>

  <!-- Reusable node-renderer helper: <use href="#agent" .../> wouldn't work
       across viewports cleanly, so each agent is inlined below. -->

  <!-- =========================================================
       Panel 1 · LINEAR (planner → fixer → verifier)
       ========================================================= -->
  <g>
    <rect x="40" y="60" width="380" height="240" rx="16" fill="none" stroke="url(#frameStroke)" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="60" y="90"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="11" font-weight="600" fill="#A78BFA" letter-spacing="0.18em">LINEAR</text>
    <text x="60" y="112"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="16" font-weight="700" fill="#E5DEFF">plan → fix → verify</text>

    <!-- Nodes (horizontal row) -->
    <g filter="url(#agentShadow)">
      <rect x="60" y="178" width="100" height="68" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="110" y="216" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E5DEFF">planner</text>
    </g>
    <g filter="url(#agentShadow)">
      <rect x="200" y="178" width="100" height="68" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="250" y="216" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E5DEFF">fixer</text>
    </g>
    <g filter="url(#agentShadow)">
      <rect x="340" y="178" width="100" height="68" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="390" y="216" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E5DEFF">verifier</text>
    </g>

    <!-- Arrows -->
    <path d="M 160 212 L 200 212" stroke="#A78BFA" stroke-width="1.6" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 300 212 L 340 212" stroke="#A78BFA" stroke-width="1.6" fill="none" marker-end="url(#agentArrow)"/>
  </g>

  <!-- =========================================================
       Panel 2 · STAR (orchestrator → workers → merger)
       ========================================================= -->
  <g>
    <rect x="450" y="60" width="380" height="240" rx="16" fill="none" stroke="url(#frameStroke)" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="470" y="90"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="11" font-weight="600" fill="#A78BFA" letter-spacing="0.18em">STAR</text>
    <text x="470" y="112"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="16" font-weight="700" fill="#E5DEFF">orchestrator · fan-out + merge</text>

    <!-- Orchestrator (left) -->
    <g filter="url(#agentShadow)">
      <rect x="470" y="180" width="100" height="68" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="520" y="210" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#E5DEFF">orchestr-</text>
      <text x="520" y="226" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#E5DEFF">ator</text>
    </g>

    <!-- 3 workers (middle column) -->
    <g filter="url(#agentShadow)">
      <rect x="620" y="140" width="90" height="52" rx="9" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.2"/>
      <text x="665" y="172" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#E5DEFF">worker 1</text>
    </g>
    <g filter="url(#agentShadow)">
      <rect x="620" y="200" width="90" height="48" rx="9" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.2"/>
      <text x="665" y="230" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#E5DEFF">worker 2</text>
    </g>
    <g filter="url(#agentShadow)">
      <rect x="620" y="256" width="90" height="48" rx="9" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.2"/>
      <text x="665" y="286" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#E5DEFF">worker 3</text>
    </g>

    <!-- Merger (right) -->
    <g filter="url(#agentShadow)">
      <rect x="740" y="180" width="80" height="68" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="780" y="220" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#E5DEFF">merger</text>
    </g>

    <!-- Fan-out arrows -->
    <path d="M 570 200 C 600 200, 610 166, 620 166" stroke="#A78BFA" stroke-width="1.5" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 570 218 C 600 218, 610 220, 620 220" stroke="#A78BFA" stroke-width="1.5" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 570 232 C 600 232, 610 276, 620 276" stroke="#A78BFA" stroke-width="1.5" fill="none" marker-end="url(#agentArrow)"/>

    <!-- Merge arrows -->
    <path d="M 710 166 C 720 166, 730 200, 740 200" stroke="#A78BFA" stroke-width="1.5" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 710 220 L 740 220" stroke="#A78BFA" stroke-width="1.5" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 710 276 C 720 276, 730 234, 740 234" stroke="#A78BFA" stroke-width="1.5" fill="none" marker-end="url(#agentArrow)"/>
  </g>

  <!-- =========================================================
       Panel 3 · LOOP (plan → execute → critic → plan)
       ========================================================= -->
  <g>
    <rect x="860" y="60" width="380" height="240" rx="16" fill="none" stroke="url(#frameStroke)" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="880" y="90"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="11" font-weight="600" fill="#A78BFA" letter-spacing="0.18em">LOOP</text>
    <text x="880" y="112"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="16" font-weight="700" fill="#E5DEFF">plan → execute → critic → plan</text>

    <!-- Three nodes in a triangle -->
    <g filter="url(#agentShadow)">
      <rect x="990" y="142" width="120" height="60" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="1050" y="178" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E5DEFF">planner</text>
    </g>
    <g filter="url(#agentShadow)">
      <rect x="890" y="240" width="120" height="60" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="950" y="276" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E5DEFF">executor</text>
    </g>
    <g filter="url(#agentShadow)">
      <rect x="1090" y="240" width="120" height="60" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="1150" y="276" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E5DEFF">critic</text>
    </g>

    <!-- Arrows around the cycle (curved) -->
    <!-- planner → executor (down-left) -->
    <path d="M 1010 202 C 990 220, 980 230, 970 240" stroke="#A78BFA" stroke-width="1.6" fill="none" marker-end="url(#agentArrow)"/>
    <!-- executor → critic (right) -->
    <path d="M 1010 270 L 1090 270" stroke="#A78BFA" stroke-width="1.6" fill="none" marker-end="url(#agentArrow)"/>
    <!-- critic → planner (revise — up-left) -->
    <path d="M 1130 240 C 1120 220, 1100 210, 1090 200" stroke="#F59E0B" stroke-width="1.6" fill="none" marker-end="url(#reviseArrow)"/>
    <text x="1110" y="222"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="11" font-weight="600" fill="#FBBF24">revise</text>
  </g>

  <!-- Footer caption -->
  <text x="640" y="340" text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="11" fill="#6b7382" letter-spacing="0.10em">
    chains live in catalog/chains/ · each one analyzed against the five risks plus topology-specific propagation concerns
  </text>
</svg>
