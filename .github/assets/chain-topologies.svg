<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="SMADP chain topologies — linear, star, loop" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0a1b"/>
      <stop offset="1" stop-color="#0a0612"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="agentFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#311e58"/>
      <stop offset="1" stop-color="#170a2e"/>
    </linearGradient>

    <linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#B89BFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <marker id="agentArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C4ACFF"/>
    </marker>
    <marker id="reviseArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#FBBF24"/>
    </marker>
  </defs>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- ================== LINEAR ================== -->
  <g>
    <rect x="40" y="60" width="380" height="240" rx="16" fill="none" stroke="url(#frameStroke)" stroke-width="1.8" stroke-opacity="0.7"/>
    <text x="60" y="98"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="13" font-weight="700" fill="#C4B5FD" letter-spacing="0.20em">LINEAR</text>
    <text x="60" y="126"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="19" font-weight="700" fill="#F5F0FF">plan → fix → verify</text>

    <!-- Boxes resized + repositioned to stay strictly inside the 380-wide frame -->
    <g>
      <rect x="60" y="184" width="95" height="68" rx="10" fill="url(#agentFace)" stroke="#B89BFF" stroke-width="2"/>
      <text x="107" y="218" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F5F0FF">planner</text>
    </g>
    <g>
      <rect x="185" y="184" width="95" height="68" rx="10" fill="url(#agentFace)" stroke="#B89BFF" stroke-width="2"/>
      <text x="232" y="218" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F5F0FF">fixer</text>
    </g>
    <g>
      <rect x="310" y="184" width="95" height="68" rx="10" fill="url(#agentFace)" stroke="#B89BFF" stroke-width="2"/>
      <text x="357" y="218" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F5F0FF">verifier</text>
    </g>

    <path d="M 155 218 L 185 218" stroke="#C4ACFF" stroke-width="2.2" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 280 218 L 310 218" stroke="#C4ACFF" stroke-width="2.2" fill="none" marker-end="url(#agentArrow)"/>
  </g>

  <!-- ================== STAR ================== -->
  <g>
    <rect x="450" y="60" width="380" height="240" rx="16" fill="none" stroke="url(#frameStroke)" stroke-width="1.8" stroke-opacity="0.7"/>
    <text x="470" y="98"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="13" font-weight="700" fill="#C4B5FD" letter-spacing="0.20em">STAR</text>
    <text x="470" y="126"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="19" font-weight="700" fill="#F5F0FF">orchestrator · fan-out + merge</text>

    <g>
      <rect x="465" y="184" width="125" height="60" rx="10" fill="url(#agentFace)" stroke="#B89BFF" stroke-width="2"/>
      <text x="527" y="214" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F5F0FF">orchestrator</text>
    </g>

    <g>
      <rect x="625" y="140" width="90" height="48" rx="9" fill="url(#agentFace)" stroke="#B89BFF" stroke-width="2"/>
      <text x="670" y="164" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#F5F0FF">worker 1</text>
    </g>
    <g>
      <rect x="625" y="200" width="90" height="48" rx="9" fill="url(#agentFace)" stroke="#B89BFF" stroke-width="2"/>
      <text x="670" y="224" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#F5F0FF">worker 2</text>
    </g>
    <g>
      <rect x="625" y="260" width="90" height="48" rx="9" fill="url(#agentFace)" stroke="#B89BFF" stroke-width="2"/>
      <text x="670" y="284" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="600" fill="#F5F0FF">worker 3</text>
    </g>

    <g>
      <rect x="735" y="184" width="85" height="60" rx="10" fill="url(#agentFace)" stroke="#B89BFF" stroke-width="2"/>
      <text x="777" y="214" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F5F0FF">merger</text>
    </g>

    <!-- Fan-out: all 3 emanate from orchestrator's right edge midpoint (590, 214) -->
    <path d="M 590 214 C 607 214, 615 164, 625 164" stroke="#C4ACFF" stroke-width="2" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 590 214 L 625 224"                       stroke="#C4ACFF" stroke-width="2" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 590 214 C 607 214, 615 284, 625 284" stroke="#C4ACFF" stroke-width="2" fill="none" marker-end="url(#agentArrow)"/>

    <!-- Merge: all 3 converge on merger's left edge midpoint (735, 214) -->
    <path d="M 715 164 C 723 164, 728 214, 735 214" stroke="#C4ACFF" stroke-width="2" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 715 224 L 735 214"                       stroke="#C4ACFF" stroke-width="2" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 715 284 C 723 284, 728 214, 735 214" stroke="#C4ACFF" stroke-width="2" fill="none" marker-end="url(#agentArrow)"/>
  </g>

  <!-- ================== LOOP ================== -->
  <g>
    <rect x="860" y="60" width="380" height="240" rx="16" fill="none" stroke="url(#frameStroke)" stroke-width="1.8" stroke-opacity="0.7"/>
    <text x="880" y="98"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="13" font-weight="700" fill="#C4B5FD" letter-spacing="0.20em">LOOP</text>
    <text x="880" y="126"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="19" font-weight="700" fill="#F5F0FF">plan → execute → critic → plan</text>

    <g>
      <rect x="990" y="148" width="120" height="56" rx="10" fill="url(#agentFace)" stroke="#B89BFF" stroke-width="2"/>
      <text x="1050" y="176" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F5F0FF">planner</text>
    </g>
    <g>
      <rect x="890" y="240" width="120" height="56" rx="10" fill="url(#agentFace)" stroke="#B89BFF" stroke-width="2"/>
      <text x="950" y="268" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F5F0FF">executor</text>
    </g>
    <g>
      <rect x="1090" y="240" width="120" height="56" rx="10" fill="url(#agentFace)" stroke="#B89BFF" stroke-width="2"/>
      <text x="1150" y="268" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F5F0FF">critic</text>
    </g>

    <path d="M 1030 204 C 1010 218, 985 226, 970 240"
      stroke="#C4ACFF" stroke-width="2.2" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 1010 268 L 1090 268"
      stroke="#C4ACFF" stroke-width="2.2" fill="none" marker-end="url(#agentArrow)"/>
    <!-- Revise stays inside the LOOP frame (right edge x=1240) -->
    <path d="M 1180 240 C 1212 200, 1192 156, 1112 178"
      stroke="#FBBF24" stroke-width="2.2" fill="none" marker-end="url(#reviseArrow)"/>
    <text x="1190" y="220"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="13" font-weight="700" fill="#FCD34D" letter-spacing="0.06em">revise</text>
  </g>

  <text x="640" y="340" text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="13" fill="#a09fb8" letter-spacing="0.10em">
    chains live in catalog/chains/ · each one analyzed against the five risks plus topology-specific propagation concerns
  </text>
</svg>
