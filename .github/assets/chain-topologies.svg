<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="SMADP chain topologies — linear, star, loop">
  <defs>
    <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.8" fill="#1a0b2e"/>
    </pattern>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.85">
      <stop offset="0.55" stop-color="#0b0712" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <linearGradient id="agentFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1647"/>
      <stop offset="1" stop-color="#150828"/>
    </linearGradient>

    <filter id="agentShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.5"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <marker id="agentArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA"/>
    </marker>
    <marker id="reviseArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>

    <linearGradient id="frameStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="360" fill="#0b0712"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
  <rect width="1280" height="360" fill="url(#vignette)"/>

  <!-- ================== LINEAR ================== -->
  <g>
    <rect x="40" y="60" width="380" height="240" rx="16" fill="none" stroke="url(#frameStroke)" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="60" y="94"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="12" font-weight="600" fill="#C4B5FD" letter-spacing="0.18em">LINEAR</text>
    <text x="60" y="122"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="17" font-weight="700" fill="#F3EEFF">plan → fix → verify</text>

    <g filter="url(#agentShadow)">
      <rect x="60" y="180" width="100" height="68" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.4"/>
      <text x="110" y="214" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F3EEFF">planner</text>
    </g>
    <g filter="url(#agentShadow)">
      <rect x="200" y="180" width="100" height="68" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.4"/>
      <text x="250" y="214" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F3EEFF">fixer</text>
    </g>
    <g filter="url(#agentShadow)">
      <rect x="340" y="180" width="100" height="68" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.4"/>
      <text x="390" y="214" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F3EEFF">verifier</text>
    </g>

    <path d="M 160 214 L 200 214" stroke="#A78BFA" stroke-width="1.8" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 300 214 L 340 214" stroke="#A78BFA" stroke-width="1.8" fill="none" marker-end="url(#agentArrow)"/>
  </g>

  <!-- ================== STAR ================== -->
  <g>
    <rect x="450" y="60" width="380" height="240" rx="16" fill="none" stroke="url(#frameStroke)" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="470" y="94"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="12" font-weight="600" fill="#C4B5FD" letter-spacing="0.18em">STAR</text>
    <text x="470" y="122"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="17" font-weight="700" fill="#F3EEFF">orchestrator · fan-out + merge</text>

    <!-- Orchestrator: widened so the label fits on a single line -->
    <g filter="url(#agentShadow)">
      <rect x="460" y="184" width="120" height="60" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.4"/>
      <text x="520" y="214" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F3EEFF">orchestrator</text>
    </g>

    <!-- 3 workers, evenly spaced -->
    <g filter="url(#agentShadow)">
      <rect x="615" y="140" width="90" height="48" rx="9" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="660" y="164" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F3EEFF">worker 1</text>
    </g>
    <g filter="url(#agentShadow)">
      <rect x="615" y="200" width="90" height="48" rx="9" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="660" y="224" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F3EEFF">worker 2</text>
    </g>
    <g filter="url(#agentShadow)">
      <rect x="615" y="260" width="90" height="48" rx="9" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="660" y="284" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#F3EEFF">worker 3</text>
    </g>

    <!-- Merger -->
    <g filter="url(#agentShadow)">
      <rect x="735" y="184" width="85" height="60" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.4"/>
      <text x="777" y="214" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#F3EEFF">merger</text>
    </g>

    <!-- Fan-out: all 3 arrows leave the orchestrator's right-edge midpoint -->
    <path d="M 580 214 C 597 214, 605 164, 615 164" stroke="#A78BFA" stroke-width="1.7" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 580 214 L 615 224"                       stroke="#A78BFA" stroke-width="1.7" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 580 214 C 597 214, 605 284, 615 284" stroke="#A78BFA" stroke-width="1.7" fill="none" marker-end="url(#agentArrow)"/>

    <!-- Merge: all 3 arrows converge on the merger's left-edge midpoint -->
    <path d="M 705 164 C 720 164, 725 214, 735 214" stroke="#A78BFA" stroke-width="1.7" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 705 224 L 735 214"                       stroke="#A78BFA" stroke-width="1.7" fill="none" marker-end="url(#agentArrow)"/>
    <path d="M 705 284 C 720 284, 725 214, 735 214" stroke="#A78BFA" stroke-width="1.7" fill="none" marker-end="url(#agentArrow)"/>
  </g>

  <!-- ================== LOOP ================== -->
  <g>
    <rect x="860" y="60" width="380" height="240" rx="16" fill="none" stroke="url(#frameStroke)" stroke-width="1.2" stroke-opacity="0.6"/>
    <text x="880" y="94"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="12" font-weight="600" fill="#C4B5FD" letter-spacing="0.18em">LOOP</text>
    <text x="880" y="122"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="17" font-weight="700" fill="#F3EEFF">plan → execute → critic → plan</text>

    <!-- planner (top center) -->
    <g filter="url(#agentShadow)">
      <rect x="990" y="148" width="120" height="56" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.4"/>
      <text x="1050" y="176" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F3EEFF">planner</text>
    </g>
    <!-- executor (bottom-left) -->
    <g filter="url(#agentShadow)">
      <rect x="890" y="240" width="120" height="56" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.4"/>
      <text x="950" y="268" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F3EEFF">executor</text>
    </g>
    <!-- critic (bottom-right) -->
    <g filter="url(#agentShadow)">
      <rect x="1090" y="240" width="120" height="56" rx="10" fill="url(#agentFace)" stroke="#A78BFA" stroke-width="1.4"/>
      <text x="1150" y="268" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F3EEFF">critic</text>
    </g>

    <!-- planner → executor (down-left curve) -->
    <path d="M 1030 204 C 1010 218, 985 226, 970 240"
      stroke="#A78BFA" stroke-width="1.8" fill="none" marker-end="url(#agentArrow)"/>
    <!-- executor → critic (horizontal) -->
    <path d="M 1010 268 L 1090 268"
      stroke="#A78BFA" stroke-width="1.8" fill="none" marker-end="url(#agentArrow)"/>
    <!-- critic → planner (revise, up-and-over) -->
    <path d="M 1180 240 C 1210 200, 1190 156, 1110 178"
      stroke="#F59E0B" stroke-width="1.8" fill="none" marker-end="url(#reviseArrow)"/>
    <text x="1195" y="222"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="12" font-weight="700" fill="#FCD34D" letter-spacing="0.06em">revise</text>
  </g>

  <!-- Footer caption -->
  <text x="640" y="338" text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="12" fill="#8b8aa7" letter-spacing="0.10em">
    chains live in catalog/chains/ · each one analyzed against the five risks plus topology-specific propagation concerns
  </text>
</svg>
