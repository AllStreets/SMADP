<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="SMADP architecture · humans curate / autopilot / operator gate / public catalog" shape-rendering="geometricPrecision" text-rendering="geometricPrecision">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0a1b"/>
      <stop offset="1" stop-color="#0a0612"/>
    </linearGradient>

    <radialGradient id="glowL" cx="0.18" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.82" cy="0.5" r="0.42">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="faceHuman" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2e1850"/>
      <stop offset="1" stop-color="#170a2e"/>
    </linearGradient>
    <linearGradient id="faceAutopilot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2632"/>
      <stop offset="1" stop-color="#05121b"/>
    </linearGradient>
    <linearGradient id="faceGate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#33260b"/>
      <stop offset="1" stop-color="#1c1305"/>
    </linearGradient>
    <linearGradient id="facePublic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2d1c"/>
      <stop offset="1" stop-color="#04140b"/>
    </linearGradient>

    <linearGradient id="strokeHuman" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C4ACFF"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="strokeAutopilot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="strokeGate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="strokePublic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#86EFAC"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>

    <marker id="arrowViolet" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#C4ACFF"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowApprove" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22C55E"/>
    </marker>
    <marker id="arrowReject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>
  </defs>

  <rect width="1280" height="460" fill="url(#bg)"/>
  <rect width="1280" height="460" fill="url(#glowL)"/>
  <rect width="1280" height="460" fill="url(#glowR)"/>

  <!-- ===== ONEXUS source (standalone) ===== -->
  <g>
    <rect x="40" y="60" width="220" height="74" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="2"/>
    <text x="150" y="92" text-anchor="middle" dominant-baseline="central"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="16" font-weight="700" fill="#EAFBFF">ONEXUS-Agents catalog</text>
    <text x="150" y="115" text-anchor="middle" dominant-baseline="central"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="13" fill="#9DDDEC">6,200+ profiles</text>
  </g>

  <!-- ===== HUMANS CURATE ===== -->
  <g>
    <rect x="40" y="180" width="220" height="120" rx="14" fill="none" stroke="url(#strokeHuman)" stroke-width="2"/>
    <text x="150" y="206" text-anchor="middle" dominant-baseline="central"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="13" font-weight="700" fill="#D9CCFF" letter-spacing="0.20em">HUMANS CURATE</text>
    <g>
      <rect x="60" y="222" width="180" height="64" rx="10" fill="url(#faceHuman)" stroke="#B89BFF" stroke-width="2"/>
      <text x="150" y="245" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F5F0FF">hand-crafted</text>
      <text x="150" y="267" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#F5F0FF">seed catalog</text>
    </g>
  </g>

  <!-- ===== AUTOPILOT ===== -->
  <g>
    <rect x="300" y="60" width="540" height="240" rx="16" fill="none" stroke="url(#strokeAutopilot)" stroke-width="2"/>
    <text x="570" y="86" text-anchor="middle" dominant-baseline="central"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="13" font-weight="700" fill="#A8EEF8" letter-spacing="0.20em">AUTOPILOT · LAUNCHD · EVERY 300 s</text>

    <!-- ENRICH (top-left) -->
    <g>
      <rect x="320" y="104" width="240" height="72" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="2"/>
      <text x="440" y="132" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#EAFBFF">enrich stubs → docs-only</text>
      <text x="440" y="156" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#9DDDEC">README + LLM</text>
    </g>
    <!-- SCAFFOLD (top-right) -->
    <g>
      <rect x="580" y="104" width="240" height="72" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="2"/>
      <text x="700" y="132" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#EAFBFF">scaffold MCP adapter</text>
      <text x="700" y="156" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#9DDDEC">Dockerfile + entrypoint</text>
    </g>
    <!-- RUN (bottom-left) -->
    <g>
      <rect x="320" y="200" width="240" height="80" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="2"/>
      <text x="440" y="228" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#EAFBFF">sandbox · Docker scenarios</text>
      <text x="440" y="252" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#9DDDEC">calendar / notes / spreadsheet</text>
    </g>
    <!-- GRADE (bottom-right) -->
    <g>
      <rect x="580" y="200" width="240" height="80" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="2"/>
      <text x="700" y="228" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#EAFBFF">sandbox judge</text>
      <text x="700" y="252" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#9DDDEC">LLM grades transcript</text>
    </g>
    <!-- Inner flow arrows -->
    <path d="M 560 140 L 580 140" stroke="#22D3EE" stroke-width="2" fill="none" marker-end="url(#arrowCyan)"/>
    <path d="M 560 240 L 580 240" stroke="#22D3EE" stroke-width="2" fill="none" marker-end="url(#arrowCyan)"/>
    <path d="M 700 176 L 700 200" stroke="#22D3EE" stroke-width="2" fill="none" marker-end="url(#arrowCyan)"/>
  </g>

  <!-- ===== OPERATOR GATE ===== -->
  <g>
    <rect x="880" y="60" width="180" height="240" rx="16" fill="none" stroke="url(#strokeGate)" stroke-width="2"/>
    <text x="970" y="86" text-anchor="middle" dominant-baseline="central"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="13" font-weight="700" fill="#FFD988" letter-spacing="0.20em">OPERATOR GATE</text>

    <g>
      <rect x="900" y="104" width="140" height="64" rx="10" fill="url(#faceGate)" stroke="#F59E0B" stroke-width="2"/>
      <text x="970" y="126" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#FBBF24">catalog/pending/</text>
      <text x="970" y="148" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FDE68A">review queue</text>
    </g>

    <g transform="translate(970, 234)">
      <polygon points="0,-54 76,0 0,54 -76,0" fill="url(#faceGate)" stroke="#F59E0B" stroke-width="2"/>
      <text x="0" y="-8" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FDE68A">smadp pending</text>
      <text x="0" y="12" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FDE68A">approve / reject</text>
    </g>

    <path d="M 970 168 L 970 180" stroke="#F59E0B" stroke-width="2" fill="none" marker-end="url(#arrowReject)"/>
  </g>

  <!-- ===== PUBLIC CATALOG ===== -->
  <g>
    <rect x="1080" y="100" width="180" height="200" rx="16" fill="none" stroke="url(#strokePublic)" stroke-width="2"/>
    <text x="1170" y="126" text-anchor="middle" dominant-baseline="central"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="13" font-weight="700" fill="#B8F2C7" letter-spacing="0.20em">PUBLIC CATALOG</text>

    <g>
      <rect x="1100" y="146" width="140" height="58" rx="10" fill="url(#facePublic)" stroke="#22C55E" stroke-width="2"/>
      <text x="1170" y="175" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#BBF7D0">catalog/verdicts/</text>
    </g>
    <g>
      <rect x="1100" y="216" width="140" height="64" rx="10" fill="url(#facePublic)" stroke="#22C55E" stroke-width="2"/>
      <text x="1170" y="239" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="#DCFCE7">Astro site</text>
      <text x="1170" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="13" fill="#86EFAC">~12,900 pages</text>
    </g>
    <path d="M 1170 204 L 1170 216" stroke="#22C55E" stroke-width="2" fill="none" marker-end="url(#arrowApprove)"/>
  </g>

  <!-- ===== REJECTED tray ===== -->
  <g>
    <rect x="1080" y="346" width="180" height="68" rx="10" fill="url(#faceGate)" stroke="#F59E0B" stroke-width="2"/>
    <text x="1170" y="369" text-anchor="middle" dominant-baseline="central"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="13" fill="#FBBF24">catalog/_rejected/</text>
    <text x="1170" y="392" text-anchor="middle" dominant-baseline="central"
      font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#FDE68A">preserved + reason</text>
  </g>

  <!-- ===== Cross-cluster arrows ===== -->
  <!-- ONEXUS → ENRICH -->
  <path d="M 260 96 C 290 96, 290 140, 320 140"
    stroke="#22D3EE" stroke-width="2" fill="none" marker-end="url(#arrowCyan)"/>

  <!-- SCAFFOLD → pending -->
  <path d="M 820 140 C 855 140, 870 134, 900 134"
    stroke="#C4ACFF" stroke-width="2" fill="none" marker-end="url(#arrowViolet)"/>

  <!-- GRADE → pending (lower curve) -->
  <path d="M 820 240 C 855 240, 875 142, 900 138"
    stroke="#C4ACFF" stroke-width="2" fill="none" marker-end="url(#arrowViolet)" opacity="0.85"/>

  <!-- humans seed → verdicts (curves over the top of autopilot, into PUBLIC) -->
  <path d="M 260 250 C 490 250, 1000 175, 1100 175"
    stroke="url(#strokeHuman)" stroke-width="2" fill="none" marker-end="url(#arrowViolet)" opacity="0.7"/>

  <!-- approve → verdicts: arrow ends BEFORE crossing the public-catalog frame so the label sits cleanly in the gap -->
  <path d="M 1046 234 C 1062 210, 1078 188, 1098 176"
    stroke="#22C55E" stroke-width="2.4" fill="none" marker-end="url(#arrowApprove)"/>
  <text x="1052" y="200"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="13" font-weight="700" fill="#86EFAC">approve</text>

  <!-- reject → rejected tray -->
  <path d="M 1046 274 C 1066 312, 1086 340, 1100 360"
    stroke="#F59E0B" stroke-width="2.4" fill="none" marker-end="url(#arrowReject)"/>
  <text x="1056" y="334"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="13" font-weight="700" fill="#FBBF24">reject</text>

  <!-- Footer caption -->
  <text x="640" y="442" text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="13" fill="#a09fb8" letter-spacing="0.10em">
    autonomous production · operator-gated publish · every artifact cited, every transition logged
  </text>
</svg>
