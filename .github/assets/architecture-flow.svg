<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="SMADP architecture · humans curate / autopilot / operator gate / public catalog">
  <defs>
    <!-- Subtle dot grid -->
    <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.8" fill="#1a0b2e"/>
    </pattern>

    <!-- Ambient background glows -->
    <radialGradient id="glowL" cx="0.18" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.82" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0.55" stop-color="#0b0712" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <!-- Node face gradients -->
    <linearGradient id="faceHuman" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1647"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="faceAutopilot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1f29"/>
      <stop offset="1" stop-color="#06121a"/>
    </linearGradient>
    <linearGradient id="faceGate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f0a"/>
      <stop offset="1" stop-color="#1a1304"/>
    </linearGradient>
    <linearGradient id="facePublic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2418"/>
      <stop offset="1" stop-color="#04140b"/>
    </linearGradient>

    <!-- Cluster frame gradients (left-to-right tinted strokes) -->
    <linearGradient id="strokeHuman" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="strokeAutopilot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="strokeGate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="strokePublic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>

    <!-- Arrow markers -->
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowApprove" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22C55E"/>
    </marker>
    <marker id="arrowReject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>

    <!-- Soft drop shadow -->
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="460" fill="#0b0712"/>
  <rect width="1280" height="460" fill="url(#grid)"/>
  <rect width="1280" height="460" fill="url(#glowL)"/>
  <rect width="1280" height="460" fill="url(#glowR)"/>
  <rect width="1280" height="460" fill="url(#vignette)"/>

  <!-- ===== Cluster: ONEXUS source (small standalone, top-left) ===== -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="60" width="220" height="68" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="1.2" stroke-opacity="0.7"/>
    <text x="150" y="92" text-anchor="middle"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="14" font-weight="700" fill="#e6f8ff">ONEXUS-Agents catalog</text>
    <text x="150" y="110" text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="11" fill="#7fb8c6">6,200+ profiles</text>
  </g>

  <!-- ===== Cluster: humans curate (top-right area, before public) ===== -->
  <g>
    <rect x="40" y="180" width="220" height="120" rx="14" fill="none" stroke="url(#strokeHuman)" stroke-width="1.5"/>
    <text x="150" y="200" text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="11" font-weight="600" fill="#C7B8FF" letter-spacing="0.18em">HUMANS CURATE</text>
    <g filter="url(#cardShadow)">
      <rect x="60" y="218" width="180" height="62" rx="10" fill="url(#faceHuman)" stroke="#A78BFA" stroke-width="1.2"/>
      <text x="150" y="246" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E5DEFF">hand-crafted</text>
      <text x="150" y="264" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#E5DEFF">seed catalog</text>
    </g>
  </g>

  <!-- ===== Cluster: autopilot (middle, wide) ===== -->
  <g>
    <rect x="300" y="60" width="540" height="240" rx="16" fill="none" stroke="url(#strokeAutopilot)" stroke-width="1.5"/>
    <text x="570" y="80" text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="11" font-weight="600" fill="#7FE6F5" letter-spacing="0.18em">AUTOPILOT · LAUNCHD · EVERY 300 s</text>

    <!-- 4 inner nodes in a 2×2 grid -->
    <!-- ENRICH (top-left) -->
    <g filter="url(#cardShadow)">
      <rect x="320" y="100" width="240" height="68" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="1.2"/>
      <text x="440" y="130" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e6f8ff">enrich stubs → docs-only</text>
      <text x="440" y="148" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#7fb8c6">README + LLM</text>
    </g>
    <!-- SCAFFOLD (top-right) -->
    <g filter="url(#cardShadow)">
      <rect x="580" y="100" width="240" height="68" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="1.2"/>
      <text x="700" y="130" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e6f8ff">scaffold MCP adapter</text>
      <text x="700" y="148" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#7fb8c6">Dockerfile + entrypoint</text>
    </g>
    <!-- RUN (bottom-left) -->
    <g filter="url(#cardShadow)">
      <rect x="320" y="200" width="240" height="80" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="1.2"/>
      <text x="440" y="230" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e6f8ff">sandbox · Docker scenarios</text>
      <text x="440" y="250" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#7fb8c6">calendar / notes / spreadsheet</text>
    </g>
    <!-- GRADE (bottom-right) -->
    <g filter="url(#cardShadow)">
      <rect x="580" y="200" width="240" height="80" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="1.2"/>
      <text x="700" y="230" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#e6f8ff">sandbox judge</text>
      <text x="700" y="250" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#7fb8c6">LLM grades transcript</text>
    </g>
    <!-- Inner flow arrows -->
    <path d="M 560 134 L 580 134" stroke="#22D3EE" stroke-width="1.4" fill="none" marker-end="url(#arrow)" opacity="0.7"/>
    <path d="M 560 240 L 580 240" stroke="#22D3EE" stroke-width="1.4" fill="none" marker-end="url(#arrow)" opacity="0.7"/>
    <path d="M 700 168 L 700 200" stroke="#22D3EE" stroke-width="1.4" fill="none" marker-end="url(#arrow)" opacity="0.7"/>
  </g>

  <!-- ===== Cluster: operator gate ===== -->
  <g>
    <rect x="880" y="60" width="180" height="240" rx="16" fill="none" stroke="url(#strokeGate)" stroke-width="1.5"/>
    <text x="970" y="80" text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="11" font-weight="600" fill="#FBBF24" letter-spacing="0.18em">OPERATOR GATE</text>

    <!-- pending queue node -->
    <g filter="url(#cardShadow)">
      <rect x="900" y="100" width="140" height="60" rx="10" fill="url(#faceGate)" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="970" y="124" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#FBBF24">catalog/pending/</text>
      <text x="970" y="142" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fde68a">review queue</text>
    </g>

    <!-- approve diamond -->
    <g transform="translate(970, 230)" filter="url(#cardShadow)">
      <polygon points="0,-50 70,0 0,50 -70,0" fill="url(#faceGate)" stroke="#F59E0B" stroke-width="1.2"/>
      <text x="0" y="-4" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fde68a">smadp pending</text>
      <text x="0" y="12" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fde68a">approve / reject</text>
    </g>

    <!-- Arrow from pending → approve -->
    <path d="M 970 160 L 970 180" stroke="#F59E0B" stroke-width="1.4" fill="none" marker-end="url(#arrow)" opacity="0.7"/>
  </g>

  <!-- ===== Cluster: public catalog ===== -->
  <g>
    <rect x="1080" y="100" width="180" height="200" rx="16" fill="none" stroke="url(#strokePublic)" stroke-width="1.5"/>
    <text x="1170" y="120" text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="11" font-weight="600" fill="#86EFAC" letter-spacing="0.18em">PUBLIC CATALOG</text>

    <g filter="url(#cardShadow)">
      <rect x="1100" y="140" width="140" height="56" rx="10" fill="url(#facePublic)" stroke="#22C55E" stroke-width="1.2"/>
      <text x="1170" y="172" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#bbf7d0">catalog/verdicts/</text>
    </g>
    <g filter="url(#cardShadow)">
      <rect x="1100" y="216" width="140" height="58" rx="10" fill="url(#facePublic)" stroke="#22C55E" stroke-width="1.2"/>
      <text x="1170" y="240" text-anchor="middle"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#dcfce7">Astro site</text>
      <text x="1170" y="258" text-anchor="middle"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="11" fill="#86EFAC">~12,800 pages</text>
    </g>
    <path d="M 1170 196 L 1170 216" stroke="#22C55E" stroke-width="1.4" fill="none" marker-end="url(#arrowApprove)" opacity="0.7"/>
  </g>

  <!-- ===== Rejected (bottom-right, outside public) ===== -->
  <g filter="url(#cardShadow)">
    <rect x="1080" y="340" width="180" height="64" rx="10" fill="url(#faceGate)" stroke="#F59E0B" stroke-width="1.2"/>
    <text x="1170" y="364" text-anchor="middle"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="11" fill="#FBBF24">catalog/_rejected/</text>
    <text x="1170" y="382" text-anchor="middle"
      font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fde68a">preserved + reason</text>
  </g>

  <!-- ===== Cross-cluster arrows ===== -->
  <!-- ONEXUS → ENRICH (top of autopilot) -->
  <path d="M 260 94 C 290 94, 290 134, 320 134" stroke="#22D3EE" stroke-width="1.6" fill="none" marker-end="url(#arrow)" opacity="0.85"/>
  <!-- ENRICH (right edge) → pending -->
  <path d="M 820 134 C 860 134, 870 130, 900 130" stroke="#A78BFA" stroke-width="1.6" fill="none" marker-end="url(#arrow)" opacity="0.85"/>
  <!-- GRADE (right edge) → pending -->
  <path d="M 820 240 C 850 240, 870 140, 900 132" stroke="#A78BFA" stroke-width="1.6" fill="none" marker-end="url(#arrow)" opacity="0.7"/>
  <!-- humans → public (catalog/verdicts) -->
  <path d="M 260 240 C 700 240, 1000 168, 1100 168" stroke="url(#strokeHuman)" stroke-width="1.6" fill="none" marker-end="url(#arrow)" opacity="0.6"/>
  <!-- approve → public (label) -->
  <path d="M 1040 230 C 1060 200, 1080 180, 1100 170" stroke="#22C55E" stroke-width="1.8" fill="none" marker-end="url(#arrowApprove)"/>
  <text x="1065" y="195"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="11" font-weight="600" fill="#86EFAC">approve</text>
  <!-- reject → rejected (label) -->
  <path d="M 1040 270 C 1060 310, 1080 340, 1100 360" stroke="#F59E0B" stroke-width="1.8" fill="none" marker-end="url(#arrowReject)"/>
  <text x="1065" y="335"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="11" font-weight="600" fill="#FBBF24">reject</text>

  <!-- Footer caption -->
  <text x="640" y="440" text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="11" fill="#6b7382" letter-spacing="0.10em">
    autonomous production · operator-gated publish · every artifact cited, every transition logged
  </text>
</svg>
