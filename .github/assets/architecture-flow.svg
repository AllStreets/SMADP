<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="SMADP architecture · humans curate / autopilot / operator gate / public catalog">
  <defs>
    <pattern id="grid" x="0" y="0" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="14" cy="14" r="0.8" fill="#1a0b2e"/>
    </pattern>

    <radialGradient id="glowL" cx="0.18" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.82" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#06B6D4" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06B6D4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0.55" stop-color="#0b0712" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>

    <linearGradient id="faceHuman" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1647"/>
      <stop offset="1" stop-color="#1a0b2e"/>
    </linearGradient>
    <linearGradient id="faceAutopilot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1f29"/>
      <stop offset="1" stop-color="#06121a"/>
    </linearGradient>
    <linearGradient id="faceGate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1f0a"/>
      <stop offset="1" stop-color="#1a1304"/>
    </linearGradient>
    <linearGradient id="facePublic" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d2418"/>
      <stop offset="1" stop-color="#04140b"/>
    </linearGradient>

    <linearGradient id="strokeHuman" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="strokeAutopilot" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06B6D4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="strokeGate" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="1" stop-color="#FBBF24"/>
    </linearGradient>
    <linearGradient id="strokePublic" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22C55E"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#A78BFA"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22D3EE"/>
    </marker>
    <marker id="arrowApprove" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#22C55E"/>
    </marker>
    <marker id="arrowReject" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#F59E0B"/>
    </marker>

    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.55"/></feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="460" fill="#0b0712"/>
  <rect width="1280" height="460" fill="url(#grid)"/>
  <rect width="1280" height="460" fill="url(#glowL)"/>
  <rect width="1280" height="460" fill="url(#glowR)"/>
  <rect width="1280" height="460" fill="url(#vignette)"/>

  <!-- ===== ONEXUS source ===== -->
  <g filter="url(#cardShadow)">
    <rect x="40" y="60" width="220" height="70" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="1.3" stroke-opacity="0.8"/>
    <text x="150" y="92" text-anchor="middle" dominant-baseline="central"
      font-family="Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif"
      font-size="15" font-weight="700" fill="#E6F8FF">ONEXUS-Agents catalog</text>
    <text x="150" y="113" text-anchor="middle" dominant-baseline="central"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="12" fill="#8FCFDE">6,200+ profiles</text>
  </g>

  <!-- ===== HUMANS CURATE cluster ===== -->
  <g>
    <rect x="40" y="180" width="220" height="120" rx="14" fill="none" stroke="url(#strokeHuman)" stroke-width="1.6"/>
    <text x="150" y="206" text-anchor="middle" dominant-baseline="central"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="12" font-weight="600" fill="#D4C5FF" letter-spacing="0.18em">HUMANS CURATE</text>
    <g filter="url(#cardShadow)">
      <rect x="60" y="222" width="180" height="62" rx="10" fill="url(#faceHuman)" stroke="#A78BFA" stroke-width="1.3"/>
      <text x="150" y="244" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F3EEFF">hand-crafted</text>
      <text x="150" y="266" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#F3EEFF">seed catalog</text>
    </g>
  </g>

  <!-- ===== AUTOPILOT cluster ===== -->
  <g>
    <rect x="300" y="60" width="540" height="240" rx="16" fill="none" stroke="url(#strokeAutopilot)" stroke-width="1.6"/>
    <text x="570" y="84" text-anchor="middle" dominant-baseline="central"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="12" font-weight="600" fill="#9DEAF5" letter-spacing="0.18em">AUTOPILOT · LAUNCHD · EVERY 300 s</text>

    <!-- ENRICH (top-left) -->
    <g filter="url(#cardShadow)">
      <rect x="320" y="104" width="240" height="72" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="1.3"/>
      <text x="440" y="132" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#E6F8FF">enrich stubs → docs-only</text>
      <text x="440" y="156" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="12" fill="#8FCFDE">README + LLM</text>
    </g>
    <!-- SCAFFOLD (top-right) -->
    <g filter="url(#cardShadow)">
      <rect x="580" y="104" width="240" height="72" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="1.3"/>
      <text x="700" y="132" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#E6F8FF">scaffold MCP adapter</text>
      <text x="700" y="156" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="12" fill="#8FCFDE">Dockerfile + entrypoint</text>
    </g>
    <!-- RUN (bottom-left) -->
    <g filter="url(#cardShadow)">
      <rect x="320" y="200" width="240" height="80" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="1.3"/>
      <text x="440" y="228" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#E6F8FF">sandbox · Docker scenarios</text>
      <text x="440" y="252" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="12" fill="#8FCFDE">calendar / notes / spreadsheet</text>
    </g>
    <!-- GRADE (bottom-right) -->
    <g filter="url(#cardShadow)">
      <rect x="580" y="200" width="240" height="80" rx="10" fill="url(#faceAutopilot)" stroke="#22D3EE" stroke-width="1.3"/>
      <text x="700" y="228" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#E6F8FF">sandbox judge</text>
      <text x="700" y="252" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="12" fill="#8FCFDE">LLM grades transcript</text>
    </g>
    <!-- Inner flow arrows -->
    <path d="M 560 140 L 580 140" stroke="#22D3EE" stroke-width="1.5" fill="none" marker-end="url(#arrowCyan)" opacity="0.85"/>
    <path d="M 560 240 L 580 240" stroke="#22D3EE" stroke-width="1.5" fill="none" marker-end="url(#arrowCyan)" opacity="0.85"/>
    <path d="M 700 176 L 700 200" stroke="#22D3EE" stroke-width="1.5" fill="none" marker-end="url(#arrowCyan)" opacity="0.85"/>
  </g>

  <!-- ===== OPERATOR GATE cluster ===== -->
  <g>
    <rect x="880" y="60" width="180" height="240" rx="16" fill="none" stroke="url(#strokeGate)" stroke-width="1.6"/>
    <text x="970" y="84" text-anchor="middle" dominant-baseline="central"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="12" font-weight="600" fill="#FDD37A" letter-spacing="0.18em">OPERATOR GATE</text>

    <g filter="url(#cardShadow)">
      <rect x="900" y="104" width="140" height="64" rx="10" fill="url(#faceGate)" stroke="#F59E0B" stroke-width="1.3"/>
      <text x="970" y="126" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="12" fill="#FBBF24">catalog/pending/</text>
      <text x="970" y="148" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FDE68A">review queue</text>
    </g>

    <g transform="translate(970, 234)" filter="url(#cardShadow)">
      <polygon points="0,-54 76,0 0,54 -76,0" fill="url(#faceGate)" stroke="#F59E0B" stroke-width="1.3"/>
      <text x="0" y="-8" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A">smadp pending</text>
      <text x="0" y="12" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#FDE68A">approve / reject</text>
    </g>

    <path d="M 970 168 L 970 180" stroke="#F59E0B" stroke-width="1.5" fill="none" marker-end="url(#arrowReject)" opacity="0.85"/>
  </g>

  <!-- ===== PUBLIC CATALOG cluster ===== -->
  <g>
    <rect x="1080" y="100" width="180" height="200" rx="16" fill="none" stroke="url(#strokePublic)" stroke-width="1.6"/>
    <text x="1170" y="124" text-anchor="middle" dominant-baseline="central"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="12" font-weight="600" fill="#9DEAB4" letter-spacing="0.18em">PUBLIC CATALOG</text>

    <g filter="url(#cardShadow)">
      <rect x="1100" y="144" width="140" height="56" rx="10" fill="url(#facePublic)" stroke="#22C55E" stroke-width="1.3"/>
      <text x="1170" y="172" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="12" fill="#BBF7D0">catalog/verdicts/</text>
    </g>
    <g filter="url(#cardShadow)">
      <rect x="1100" y="218" width="140" height="62" rx="10" fill="url(#facePublic)" stroke="#22C55E" stroke-width="1.3"/>
      <text x="1170" y="240" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#DCFCE7">Astro site</text>
      <text x="1170" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="12" fill="#86EFAC">~12,800 pages</text>
    </g>
    <path d="M 1170 200 L 1170 218" stroke="#22C55E" stroke-width="1.5" fill="none" marker-end="url(#arrowApprove)" opacity="0.85"/>
  </g>

  <!-- ===== REJECTED tray ===== -->
  <g filter="url(#cardShadow)">
    <rect x="1080" y="346" width="180" height="68" rx="10" fill="url(#faceGate)" stroke="#F59E0B" stroke-width="1.3"/>
    <text x="1170" y="368" text-anchor="middle" dominant-baseline="central"
      font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
      font-size="12" fill="#FBBF24">catalog/_rejected/</text>
    <text x="1170" y="390" text-anchor="middle" dominant-baseline="central"
      font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FDE68A">preserved + reason</text>
  </g>

  <!-- ===== Cross-cluster arrows ===== -->
  <!-- ONEXUS → ENRICH -->
  <path d="M 260 94 C 290 94, 290 140, 320 140"
    stroke="#22D3EE" stroke-width="1.7" fill="none" marker-end="url(#arrowCyan)" opacity="0.9"/>

  <!-- ENRICH+SCAFFOLD → pending (top edge of autopilot, runs along) -->
  <path d="M 820 140 C 860 140, 870 134, 900 134"
    stroke="#A78BFA" stroke-width="1.7" fill="none" marker-end="url(#arrow)" opacity="0.9"/>

  <!-- GRADE → pending -->
  <path d="M 820 240 C 855 240, 875 140, 900 138"
    stroke="#A78BFA" stroke-width="1.7" fill="none" marker-end="url(#arrow)" opacity="0.75"/>

  <!-- humans seed → public verdicts (curves over the top of autopilot) -->
  <path d="M 260 244 C 480 244, 1000 172, 1100 172"
    stroke="url(#strokeHuman)" stroke-width="1.7" fill="none" marker-end="url(#arrow)" opacity="0.55"/>

  <!-- approve → public -->
  <path d="M 1046 234 C 1070 210, 1085 188, 1100 174"
    stroke="#22C55E" stroke-width="1.9" fill="none" marker-end="url(#arrowApprove)"/>
  <text x="1060" y="196"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="12" font-weight="700" fill="#86EFAC">approve</text>

  <!-- reject → rejected -->
  <path d="M 1046 274 C 1068 312, 1086 340, 1100 360"
    stroke="#F59E0B" stroke-width="1.9" fill="none" marker-end="url(#arrowReject)"/>
  <text x="1058" y="332"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="12" font-weight="700" fill="#FBBF24">reject</text>

  <!-- Footer caption -->
  <text x="640" y="438" text-anchor="middle"
    font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
    font-size="12" fill="#8b8aa7" letter-spacing="0.10em">
    autonomous production · operator-gated publish · every artifact cited, every transition logged
  </text>
</svg>
