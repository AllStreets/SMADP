name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    # Only SITE CODE changes deploy immediately. The catalog + adapters change on
    # nearly every autopilot tick (~68 pushes/day); redeploying Pages per commit
    # ran overlapping deployments that collided on the single github-pages
    # environment and failed with "Deployment failed, try again later". Those
    # high-churn data dirs are published on the hourly schedule below instead.
    paths:
      - 'site/**'
      - '.github/workflows/deploy-pages.yml'
  schedule:
    # Publish the latest catalog/adapters hourly (build checks out main HEAD).
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # If a newer deploy starts, cancel the older in-flight one rather than queueing
  # it — a stale queued deploy against a newer Pages state is what "try again
  # later" was. The site content is idempotent, so latest-wins is correct.
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Build Astro site
        env:
          PAGES: '1'
        run: pnpm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
