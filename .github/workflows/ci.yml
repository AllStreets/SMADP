name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python (lint + test + schema)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check smadp tests

      - name: Ruff format check
        run: ruff format --check smadp tests

      - name: Mypy
        run: mypy smadp

      - name: Pytest
        run: pytest -q --cov=smadp --cov-report=term-missing

      - name: Smoke — transparency verify (empty log returns OK)
        env:
          SMADP_CACHE_DIR: ${{ runner.temp }}/smadp-ci-cache
        run: |
          python -c "
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat
          k = Ed25519PrivateKey.generate()
          import pathlib
          p = pathlib.Path('${{ runner.temp }}/pub.hex')
          p.write_text(k.public_key().public_bytes(encoding=Encoding.Raw, format=PublicFormat.Raw).hex())
          "
          python -m smadp.cli transparency verify --public-key "${{ runner.temp }}/pub.hex"

      - name: Catalog lint (smadp lint)
        run: smadp lint --catalog catalog

  site:
    name: Dashboard (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
